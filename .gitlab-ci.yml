
workflow:
  auto_cancel:
    # When one job fails, stop the other running jobs.
    on_job_failure: all
    on_new_commit: interruptible

.e2e_base_template: &e2e_base
  variables:
    BASE_URL: "http://localhost"
  image:
    name: source.updraftplus.com:5050/ci/playwright-e2e:php-8.5-wp-7.1-RC3
    entrypoint: [""]
  cache:
    - key:
        files:
          - package.json
          - package-lock.json
      paths:
        - .npm/
        - package-lock.json
  before_script:
    - npm ci --no-audit --cache .npm --prefer-offline
    - bash /usr/local/bin/entrypoint.sh
    - cp -R . /var/www/html/wp-content/plugins/burst-statistics/
    # The directory needs to be owned by www-data (without this attempting to write translation files will fail)
    - chown -R www-data:www-data /var/www/html/wp-content/plugins/burst-statistics/
    - chown -R www-data:www-data /var/www/html/
    # Pre-create debug.log writable for both root (wp-cli) and www-data (web).
    # On PHP 8.5 the root-run wp-cli commands below log deprecations from the
    # wp-cli phar, which would otherwise create debug.log as root:root — after
    # which all web-request log lines are silently dropped.
    - touch /var/www/html/wp-content/debug.log && chown www-data:www-data /var/www/html/wp-content/debug.log && chmod 666 /var/www/html/wp-content/debug.log
    - wp plugin activate burst-statistics --path=/var/www/html
  after_script:
    - cp /var/log/php_errors.log error.log || true
    - cp /var/www/html/wp-content/debug.log debug.log || true
  artifacts:
    paths:
      - screenshots/
      - debug.log
      - error.log
    expire_in: 1h
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

test:phpunit:
  <<: *e2e_base
  before_script:
    - npm ci --no-audit --cache .npm --prefer-offline
    - bash /usr/local/bin/entrypoint.sh
    - cp -R . /var/www/html/wp-content/plugins/burst-statistics/
    # The directory needs to be owned by www-data (without this attempting to write translation files will fail)
    - chown -R www-data:www-data /var/www/html/wp-content/plugins/burst-statistics/
    # See e2e_base: keep debug.log writable for www-data despite root wp-cli writes.
    - touch /var/www/html/wp-content/debug.log && chown www-data:www-data /var/www/html/wp-content/debug.log && chmod 666 /var/www/html/wp-content/debug.log
    - wp plugin activate burst-statistics --path=/var/www/html
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install
  script:
    - php vendor/bin/phpunit --debug 2>&1

test:e2e:
  <<: *e2e_base
  script:
    - npm run e2e

